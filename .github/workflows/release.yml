name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-binaries:
    name: Build ${{ matrix.component }} ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - component: server
            build_path: ./cmd/server
            goos: linux
            goarch: amd64
          - component: server
            build_path: ./cmd/server
            goos: linux
            goarch: arm64
          - component: server
            build_path: ./cmd/server
            goos: windows
            goarch: amd64
          - component: agent
            build_path: ./cmd
            goos: linux
            goarch: amd64
          - component: agent
            build_path: ./cmd
            goos: linux
            goarch: arm64
          - component: agent
            build_path: ./cmd
            goos: windows
            goarch: amd64
          - component: agent
            build_path: ./cmd
            goos: darwin
            goarch: amd64
          - component: agent
            build_path: ./cmd
            goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Build binary
        working-directory: ./${{ matrix.component }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          OUTPUT_NAME=${{ matrix.component }}-${{ matrix.goos }}-${{ matrix.goarch }}
          if [ "${{ matrix.goos }}" = "windows" ]; then
            OUTPUT_NAME="${OUTPUT_NAME}.exe"
          fi
          go build -ldflags="-s -w" -o "${OUTPUT_NAME}" ${{ matrix.build_path }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.component }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ./${{ matrix.component }}/${{ matrix.component }}-*
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-artifacts
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: ./release-artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
