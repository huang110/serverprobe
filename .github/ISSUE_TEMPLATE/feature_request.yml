name: 功能建议
description: 建议一个新功能或改进
title: "[Feature]: "
labels: ["enhancement"]

body:
  - type: markdown
    attributes:
      value: |
        感谢您提出功能建议！

  - type: textarea
    id: problem
    attributes:
      label: 相关问题
      description: 此功能是否解决了某个问题？
      placeholder: 我在使用时遇到了...
    validations:
      required: false

  - type: textarea
    id: solution
    attributes:
      label: 建议的解决方案
      description: 您希望如何解决此问题
      placeholder: 我希望能够...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 您考虑过的其他替代方案
    validations:
      required: false

  - type: checkboxes
    id: component
    attributes:
      label: 涉及的组件
      options:
        - label: Agent
        - label: Server
        - label: Frontend
        - label: Docker
        - label: 文档

  - type: textarea
    id: additional
    attributes:
      label: 其他信息
      description: 其他有助于理解此功能的信息
