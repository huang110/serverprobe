syntax = "proto3";
package serverprobe;
option go_package = "./proto";

import "google/protobuf/timestamp.proto";

// ==================== 服务定义 ====================
service ProbeService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc GetConfig(GetConfigRequest) returns (GetConfigResponse);
  rpc RotateToken(RotateTokenRequest) returns (RotateTokenResponse);
}

// ==================== 注册接口 ====================
message RegisterRequest {
  string register_secret = 1;
  string hostname = 2;
  string ip = 3;
  string internal_ip = 4;
  string os = 5;
  string os_version = 6;
  string kernel_version = 7;
  int32 cpu_cores = 8;
  int64 memory_total = 9;
  int64 disk_total = 10;
  string arch = 11;
  string agent_version = 12;
  map<string, string> labels = 13;
  bool lite_mode = 14;
}

message RegisterResponse {
  bool success = 1;
  string message = 2;
  string agent_id = 3;
  string token = 4;
  int32 heartbeat_interval = 5;
  int64 token_expires_at = 6;
  ServerConfig server_config = 7;
}

message ServerConfig {
  bool enable_ip_quality = 1;
  int32 ip_quality_interval = 2;
  repeated string latency_targets = 3;
  string tls_mode = 4;
}

// ==================== 心跳 ====================
message HeartbeatRequest {
  string agent_id = 1;
  int64 timestamp = 2;
  string signature = 3;
  SystemMetrics system = 4;
  CPUMetrics cpu = 5;
  MemoryMetrics memory = 6;
  repeated DiskMetrics disks = 7;
  repeated NetworkMetrics networks = 8;
  NetworkQualityMetrics network_quality = 9;
  AgentStatus agent_status = 10;
}

message SystemMetrics {
  double load1 = 1;
  double load5 = 2;
  double load15 = 3;
  int64 uptime = 4;
  int32 process_count = 5;
  int32 tcp_established = 6;
  int32 tcp_time_wait = 7;
  int32 tcp_close_wait = 8;
  int32 udp_connections = 9;
}

message CPUMetrics {
  double usage_percent = 1;
  double user_percent = 2;
  double system_percent = 3;
  double idle_percent = 4;
  double iowait_percent = 5;
  double steal_percent = 6;
  repeated double per_core_usage = 7;
}

message MemoryMetrics {
  int64 total = 1;
  int64 used = 2;
  int64 free = 3;
  int64 available = 4;
  double usage_percent = 5;
  int64 swap_total = 6;
  int64 swap_used = 7;
  int64 swap_free = 8;
  double swap_usage_percent = 9;
  int64 buffers = 10;
  int64 cached = 11;
  int64 shared = 12;
}

message DiskMetrics {
  string device = 1;
  string mount_point = 2;
  string fs_type = 3;
  int64 total = 4;
  int64 used = 5;
  int64 free = 6;
  double usage_percent = 7;
  int64 inode_total = 8;
  int64 inode_used = 9;
  double inode_usage_percent = 10;
  double read_bytes_per_sec = 11;
  double write_bytes_per_sec = 12;
  double read_iops = 13;
  double write_iops = 14;
  double io_util_percent = 15;
}

message NetworkMetrics {
  string interface = 1;
  string ip_address = 2;
  string mac_address = 3;
  int64 rx_bytes_per_sec = 4;
  int64 tx_bytes_per_sec = 5;
  int64 rx_bytes_total = 6;
  int64 tx_bytes_total = 7;
  int64 rx_packets = 8;
  int64 tx_packets = 9;
  int64 rx_errors = 10;
  int64 tx_errors = 11;
  int64 rx_dropped = 12;
  int64 tx_dropped = 13;
}

message NetworkQualityMetrics {
  string public_ip = 1;
  string isp = 2;
  string asn = 3;
  string country = 4;
  string region = 5;
  string city = 6;
  double latitude = 7;
  double longitude = 8;
  repeated LatencyTest latency_tests = 9;
  IPQualityScore quality_score = 10;
  int64 last_check_time = 11;
}

message LatencyTest {
  string target = 1;
  string target_name = 2;
  double latency_ms = 3;
  double jitter_ms = 4;
  double packet_loss = 5;
  int32 ttl = 6;
}

message IPQualityScore {
  int32 score = 1;
  bool is_proxy = 2;
  bool is_vpn = 3;
  bool is_tor = 4;
  bool is_datacenter = 5;
  bool is_mobile = 6;
  string risk_level = 7;
  string isp_type = 8;
  repeated string bgp_prefixes = 9;
}

message AgentStatus {
  double cpu_usage = 1;
  int64 memory_usage = 2;
  int64 goroutines = 3;
  int64 uptime = 4;
  string version = 5;
  bool lite_mode = 6;
}

message HeartbeatResponse {
  bool success = 1;
  string message = 2;
  int32 next_heartbeat_interval = 3;
  string new_token = 4;
  int64 new_token_expires_at = 5;
  ConfigUpdate config_update = 6;
}

message ConfigUpdate {
  bool has_update = 1;
  int32 heartbeat_interval = 2;
  map<string, string> labels = 3;
  repeated AlertRule alert_rules = 4;
  bool enable_ip_quality = 5;
}

// ==================== Token 轮换 ====================
message RotateTokenRequest {
  string agent_id = 1;
  string current_token = 2;
  int64 timestamp = 3;
  string signature = 4;
}

message RotateTokenResponse {
  bool success = 1;
  string new_token = 2;
  int64 expires_at = 3;
}

// ==================== 获取配置 ====================
message GetConfigRequest {
  string agent_id = 1;
  int64 timestamp = 2;
  string signature = 3;
}

message GetConfigResponse {
  bool success = 1;
  int32 heartbeat_interval = 2;
  map<string, string> labels = 3;
  repeated AlertRule alert_rules = 4;
  repeated string latency_targets = 5;
  bool enable_ip_quality = 6;
}

// ==================== 告警规则 ====================
message AlertRule {
  string rule_id = 1;
  string metric_name = 2;
  string rule_type = 3;
  double threshold = 4;
  string operator = 5;
  int32 consecutive_count = 6;
  string expression = 7;
  string severity = 8;
  int32 silence_duration = 9;
  bool notify_on_recovery = 10;
  repeated string notification_channels = 11;
  int32 priority = 12;
}
