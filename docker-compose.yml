version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: serverprobe-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-serverprobe}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - serverprobe
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    container_name: serverprobe-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - serverprobe
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: serverprobe-server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVERPROBE_DATABASE_DSN: "root:${MYSQL_ROOT_PASSWORD:-root}@tcp(mysql:3306)/${MYSQL_DATABASE:-serverprobe}?charset=utf8mb4&parseTime=True&loc=UTC"
      SERVERPROBE_REDIS_ADDR: "redis:6379"
      SERVERPROBE_JWT_SECRET: "${JWT_SECRET:-change-this-in-production}"
      SERVERPROBE_JWT_ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      SERVERPROBE_JWT_ADMIN_PASSWORD: "${ADMIN_PASSWORD:-admin123}"
    volumes:
      - ./server/config.yaml:/app/config.yaml:ro
    ports:
      - "8080:8080"
      - "9090:9090"
    networks:
      - serverprobe
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/api/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: serverprobe-frontend
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "80:80"
    networks:
      - serverprobe

  agent-demo:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: serverprobe-agent-demo
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - ./agent/config.yaml:/app/config.yaml:ro
      - ./agent/scripts:/app/scripts
    networks:
      - serverprobe
    # 读取宿主机指标；生产环境请按需调整
    privileged: true
    pid: host

volumes:
  mysql_data:
  redis_data:

networks:
  serverprobe:
    driver: bridge
