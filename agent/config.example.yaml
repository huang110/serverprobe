# ServerProbe Agent 配置文件示例

# Agent 基础配置
agent:
  # Agent ID（注册后自动生成，请勿手动修改）
  id: ""
  
  # HMAC Token（注册后自动生成，请勿手动修改）
  token: ""
  
  # Token 过期时间（Unix 时间戳）
  token_expires_at: 0
  
  # 轻量级模式（减少内存占用和网络流量）
  lite_mode: false

# 服务端配置
server:
  # 服务端地址（支持 HTTPS）
  address: "https://monitor.example.com:50051"
  
  # 注册密钥（首次注册时使用，支持环境变量）
  # 环境变量：export SERVERPROBE_REGISTER_SECRET="your-secret"
  register_secret: "change-me-in-production"
  
  # TLS 模式（simple=单向TLS / mutual=双向TLS）
  tls_mode: "simple"
  
  # 自定义证书路径（可选，TLS 模式为 mutual 时使用）
  ca_cert: ""
  client_cert: ""
  client_key: ""

# 监控配置
monitor:
  # 心跳间隔（秒，默认 5）
  # 可选值：1, 5, 10, 30, 60
  heartbeat_interval: 5
  
  # 数据采集间隔（秒，默认等于心跳间隔）
  collect_interval: 5
  
  # 网络接口过滤（支持通配符）
  network_interfaces:
    - "eth*"      # 匹配 eth0, eth1, ...
    - "ens*"      # 匹配 ens33, ens192, ...
    - "en*"       # 匹配 en0 (macOS)
  
  # 磁盘挂载点过滤
  disk_mounts:
    - "/"
    - "/home"
    - "/data"
    - "/mnt"
  
  # 排除的文件系统类型
  exclude_fs_types:
    - "tmpfs"
    - "devtmpfs"
    - "squashfs"
    - "overlay"

# IP 质量检测配置
ip_quality:
  # 是否启用 TCP Ping 延迟采集
  enabled: true

  # 探测间隔（秒）
  check_interval: 15

  # 首次安装快速检测
  initial_fast_check: true

  # 延迟测试目标（未指定端口时默认 443；8.8.8.8 / 114.114.114.114 默认 53）
  latency_targets:
    - name: "电信"
      address: "202.102.192.68:53"
    - name: "联通"
      address: "210.22.70.3:53"
    - name: "移动"
      address: "211.136.192.6:53"
    - name: "阿里DNS"
      address: "223.5.5.5:443"
    - name: "Cloudflare"
      address: "1.1.1.1:443"

# 日志配置
log:
  # 日志级别（debug/info/warn/error）
  level: "info"
  
  # 日志文件路径（留空则只输出到控制台）
  file: "/var/log/serverprobe/agent.log"
  
  # 日志文件最大大小（MB）
  max_size: 100
  
  # 日志文件保留天数
  max_days: 7

# 自定义标签（用于分组和筛选）
labels:
  # 洲
  continent: "Asia"
  
  # ISP 提供商
  isp: "AWS"
  
  # 数据中心
  datacenter: "ap-southeast-1"
  
  # 环境
  environment: "production"
  
  # 业务线
  business: "api-server"
  
  # 自定义标签（可自由添加）
  # team: "devops"
  # project: "backend"
